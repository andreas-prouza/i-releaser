{% extends 'base.html' %}

{% block title %}
{% endblock %}

{% block content %}

<div class="box box-info">

    <form>
        <input type="button" onClick="location.href='/'" value='Back to overview'>
    </form>
    <br/>
    <br/>

    <!-- /.box-header -->

    <h3>Raw JSON file</h3>


    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Action</th><th>Workflow</th>
            </tr>
        </thead>
    {% for wf in workflows %}
        <tr><td><input type="button" class="btn btn-primary" onClick="start_workflow('{{ wf.name }}')" value='Start'></td>
            <td>
                {{ wf.name }}<br\>
                <details>
                  <summary>Click to expand/collapse json</summary>
                    <pre class="prettyprint lang-json">
{{ wf | pretty_json }}
                    </pre>
                </details>
            </td>
        </tr>
    {% endfor %}
    </table>
</div>

<script src="{{ url_for('static', path='assets/js/sweetalert2.all.min.js') }}"></script>
<script src="{{ url_for('static', path='assets/js/web.deploy.js') }}"></script>

<script type="text/javascript">

    (function(d) {

    stylizePreElements = function() {
    var preElements = document.getElementsByTagName("pre");
    for (i = 0; i < preElements.length; ++i) {
        var preElement = preElements[i];
        preElement.className += "prettyprint";
    }
    };

    injectPrettifyScript = function() {
    // https://github.com/googlearchive/code-prettify
    var scriptElement = document.createElement('script');
    scriptElement.setAttribute("src", "https://cdn.rawgit.com/google/code-prettify/master/loader/run_prettify.js");
    document.head.appendChild(scriptElement);
    };

    stylizePreElements();
    injectPrettifyScript();

    })(document)


    async function start_workflow(wf_name) {
        console.log(`start ${wf_name}`);
        http_get(`/api/create_deployment/${wf_name}`)
            .then((response) => {
                if (!response.ok) {
                    if (response.status === 500) {
                        return response.json().then((data) => {
                            throw new Error(data.error || 'Unknown server error');
                        });
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then((data) => {
                window.open(`/show_details/${data.meta_file.general.id}`,'_self');
            })
            .catch((error) => {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.message
                });
            });
    }

</script>

{% endblock %}
