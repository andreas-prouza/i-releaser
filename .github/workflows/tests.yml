name: Tests

on:
  push:
  pull_request:

jobs:

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get install -y unixodbc
      - run: pip install -r requirements-dev.txt
      - run: pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pip-audit
      # Ignored: starlette 0.50 is the newest with pydantic 1 (pydantic 2 doesn't build on IBM i).
      # Reason per advisory: docs/technik.md#known-vulnerabilities
      - run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281
