name: Tests

on:
  push:
  pull_request:

jobs:

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get install -y unixodbc
      - run: pip install -r requirements-dev.txt
      # Chromium for the browser tests (tests/browser_tools.py). With CI=true they fail instead of being skipped if it's missing
      - run: python -m playwright install --with-deps chromium
      # Coverage also of the web app in its own process (pyproject.toml): coverage starts in every Python process of the job
      - run: echo "import coverage; coverage.process_startup()" > "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/coverage-subprocess.pth"
      - run: coverage run -m pytest
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
      - run: coverage combine && coverage report

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.17.6
      # Rules in pyproject.toml (docs/features/code-quality-tooling.md)
      - run: ruff check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pip-audit
      # Ignored: starlette 0.50 is the newest with pydantic 1 (pydantic 2 doesn't build on IBM i).
      # Reason per advisory: docs/technik.md#known-vulnerabilities
      - run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281
