[pytest]
testpaths = tests
# Parallel with pytest-xdist (requirements-dev.txt): one process per CPU, the tests of a file in the same process
# (module fixtures like a web server are shared). `-n 0` runs all in this process, e.g. to debug one test.
addopts = -m "not ibmi" -n auto --dist loadfile
# Per test, with pytest-timeout (requirements-dev.txt): a hanging test fails instead of stopping the run
timeout = 120
markers =
    ibmi: needs a real IBM i (not run by default)
    browser: runs the web app in a real browser (Playwright, see tests/browser_tools.py); skipped if Playwright or its Chromium is not installed
